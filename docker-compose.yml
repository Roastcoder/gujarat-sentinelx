version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # POSTGRESQL + POSTGIS (Primary Relational & Spatial Database)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:15-3.3
    container_name: sentinelx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinelx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinelx_secret}
      POSTGRES_DB: ${POSTGRES_DB:-sentinelx}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelx -d sentinelx"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinelx-net

  # ----------------------------------------------------------------------------
  # REDIS (Cache & Realtime PubSub)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sentinelx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sentinelx-net

  # ----------------------------------------------------------------------------
  # KAFKA (Distributed Event Bus in KRaft Mode)
  # ----------------------------------------------------------------------------
  kafka:
    image: bashj79/kafka-kraft:latest
    container_name: sentinelx-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - sentinelx-net

  # ----------------------------------------------------------------------------
  # OPENSEARCH (Fuzzy Search & Fast ANPR Plate Retrieval)
  # ----------------------------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: sentinelx-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_SECURITY_PLUGIN=true"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - sentinelx-net

  # ----------------------------------------------------------------------------
  # CLICKHOUSE (Time-Series Vehicle Analytics at 80k Scale)
  # ----------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    container_name: sentinelx-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - sentinelx-net

  # ----------------------------------------------------------------------------
  # MINIO (S3-Compatible Evidence & Snapshot Storage)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    container_name: sentinelx-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - sentinelx-net

  # ----------------------------------------------------------------------------
  # BACKEND API (FastAPI)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: sentinelx-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-sentinelx}:${POSTGRES_PASSWORD:-sentinelx_secret}@postgres:5432/${POSTGRES_DB:-sentinelx}
      - DATABASE_SYNC_URL=postgresql://${POSTGRES_USER:-sentinelx}:${POSTGRES_PASSWORD:-sentinelx_secret}@postgres:5432/${POSTGRES_DB:-sentinelx}
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BROKERS=kafka:9092
      - OPENSEARCH_URL=http://opensearch:9200
      - CLICKHOUSE_URL=http://clickhouse:8123
      - S3_ENDPOINT=http://minio:9000
      - DEMO_MODE=true
    volumes:
      - ./storage:/app/storage
    networks:
      - sentinelx-net

  # ----------------------------------------------------------------------------
  # FRONTEND WEB (Next.js Command Center)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: sentinelx-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/api/v1/ws
    depends_on:
      - api
    networks:
      - sentinelx-net

networks:
  sentinelx-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  opensearch_data:
  clickhouse_data:
  minio_data:
